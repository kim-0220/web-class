<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Callback Function</title>
</head>
<body>
    <h1>콜백함수</h1>
    <script>
        function greet(name, callback){
            alert("안녕하세요" + name);
            callback();
        }
        function sayBye(){
            alert("안녕히 가세요!");
        }
        greet("김민지", sayBye)
        // 매개변수가 name과 callback인 greet함수를 실행하면 먼저 "안녕하세요 김민지"가 알림창에 뜨게 된다.
        // 다음으로 callback()이 실행되는데, 이때 sayBye라는 함수가 greet함수의 callback 자리에 매개변수로써 들어가게된다.
        // 따라서 callback()을 실행하는것은 sayBye함수를 실행하는 것이며, 이를 실행시키면 "안녕히 가세요!"라는 알림창이 뜨게 된다.
        // 결론적으로 "안녕하세요 김민지", "안녕히 가세요!" 두 개의 알림창이 출력된다.
        // 위의 과정에서 sayBye를 `콜백함수`라 한다.

        // 콜백함수란, 함수의 인자로 전달되는 함수로 특정시점에서 실행되며, 비동기 처리에 많이 사용된다. 이는 과도하게 중첩되면 가독성이 나빠진다.
        // 콜백함수를 사용하는 이유는 같은 함수 구조에 다른 동작을 넣을 수 있어 동작을 유연하게 바꿀 수 있고(코드 재사용성), 자바스크립트는 비동기 언어이기 때문에 시간이 걸리는 작업(서버요청, 파일읽기 등)에 콜백을 많이 사용한다.

        function aa(bb){
            bb()
        }
        aa(function(){
            alert("cc")
        })
        // 함수 선언부분 - aa는 함수이름, bb는 매개변수 (parameter), bb()는 bb를 함수처럼 실행하겠다는 의미이다. 따라서, bb()는 함수여야만 한다.
        // 함수 호출부분 - aa함수를 호출하면서 익명함수를 인자로 전달한다. 이때 전달된 익명함수는 function(){alert("cc")}이다.
        // 익명함수가 bb 매개변수 자리에 들어가고, 이 함수를 실행하게 되니까 결론적으로 알림창에 cc라는 값이 뜨게된다.
        // 콜백 함수는 `다른 함수에 인자로 전달되어, 그 함수 안에서 실행되는 함수`이다.
        // 즉, function(){alert("cc")}가 익명 콜백함수인 것이다.
        // 익명 함수(anonymous function) - function뒤()앞에 정의된 함수 이름이 없기 때문이다.

        let dd = ee=>{
            ee()
        }
        dd(()=>{
            alert("ff")
        })
        // 함수 선언부분 - dd라는 함수에 ee를 매개변수로 갖는 익명함수를 저장한다. 실행문을 보면 ee()를 실행하고 있으므로, 이는 함수여야만 한다.
        // 함수 호출부분 - dd()를 호출(실행)하면서 화살표함수를 전달하고 있다. 전될된 함수는 ()=>{alert("ff")}이며, 이는 매개변수로 ee의 자리에 들어가게 되며, 이것이 ee()로 인하여 실행된다.
        // 결론적으로 알림창에 ff라는 문구가 뜨게되고, ()=>{alert("ff")}가 화살표 함수 콜백이다.

        // 화살표 함수의 기본 형태는 (매개변수)=>{실행코드}이며, 매개변수가 한 개일때는 소괄호() 생략 가능, 실행문(실행코드)가 한 줄일때는 중괄호{} 생략 가능하다.
        // 콜백함수는 보통 짧은 동작을 전달할 때 쓰이기 때문에, 요즘에는 거의 화살표함수가 표준처럼 사용된다.
        // 화살표 함수 콜백은 짧고 간결하며, this를 바꾸지 않는 콜백 함수이다.
    </script>
</body>
</html>
