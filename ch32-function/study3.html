<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>값의 형태로 정의하는 함수</title>
</head>
<body>
    <!-- 자바스크립트에서 함수는 "값"이기 때문에 변수에 저장이 가능하고, 다른 함수에 전달이 가능하고, 필요할 때 꺼내서 실행할 수 있다. -->
    <!-- 함수 선언식 / 함수 표현식 / 화살표 함수 -->
    <script>
        function abc(d,e){
            return d + e
        }
        // 함수 선언식(function declaration) - function 키워드로 이름이 있는 함수를 직접 선언(함수 이름이 직접 있는 형태)
        // function은 함수를 선언하겠다는 키워드, abc는 함수 이름, (d,e)는 매개변수, {}는 함수가 실행될 코드블록, return은 결과값 반환이다.
        // 함수 선언식에서 가장 큰 특징은 호이스팅(Hoisting)인데, 이는 자바스크립트가 코드를 실행하기 전에 함수 선언을 먼저 메모리에 올려두는 것을 의미한다.
        // 함수 선언식의 기본 구조 - function 함수이름(매개변수){실행문}

        function a(){
            alert("안녕 나는 a야!")
        }
        a()
        // function키워드에 함수 이름이 직접 있는 형태를 함수 선언식이라하고, 현재 a라는 이름에 '함수객체(함수값)'가 저장되어 있다.
        // 위를 해석하면 a라는 이름의 함수를 하나 만들고, 이 함수를 실행하면 "안녕 나는 a야!"라는 알림창이 뜨도록 미리 등록하라는 의미이다.
        // 이후 a()를 적으면(실행시키면) 미리 등록해두었던 함수가 실행된다.

        let b = function(){
            alert("안녕 나는 b야!")
        }
        b()
        // 함수 표현식(Function Expression) - 함수를 변수에 저장하는 형태로 익명함수가 대부분이며, 호출시에는 변수 이름으로 호출하고, 선언된 이후에만 사용이 가능하다.
        // b라는 변수를 만들고, 그 안에 함수의 형태를 저장하여 함수를 정의할 수 있다. 이런 함수를 익명함수라 칭하며, 이는 호이스팅이 되지 않는다.
        // b의 ()가 공란이기 때문에 이는 이름이 없는 동작이 저장되어 있다고 해석할 수 있다. 

        let c = ()=>{
            alert("안녕 나는 c야!")
        }
        c()
        // 위처럼 function(){} 구조에서 function을 생략하고, ()=>{}처럼 화살표를 사용하여 쓸수도 있다. 이를 화살표함수라 칭한다.
        // 화살표 함수 (Arrow Function)는 `=>`를 사용하며, 함수 표현식을 간단하게 쓴 문법이다.
        
        function d(kk){
            alert(kk)
        }
        d("안녕 나는 d야!")
        // 위의 함수 선언식은 d라는 이름의 함수를 하나 만들고, 실행될 때 kk라는 값을 하나 받아서 그 값을 alert으로 보여달라는 의미이다.
        // 여기에서 kk는 매개변수(parameter)로 함수가 실행될 때 외부에서 전달받을 값으 자리이며, 아직 값이 정해지지 않은 변수를 뜻한다.
        // d("안녕 나는 d야!")는 함수 실행부로, 이를 해석하면 d함수를 실행하면서 "안녕 나는 d야!"라는 값을 kk자리에 넣어달라는 의미다.
        // 결과적으로 화면에서 새로고침을 하면 "안녕 나는 d야!"라는 글이 적힌 알림창이 뜨게된다.

        let e = function(kk){
            alert(kk)
        }
        e("안녕 나는 e야!")
        // 해석해보면 kk를 받아서 alert으로 보여주는 함수를 하나 만들고, 그 함수를 e에 저장해놓으라는 함수 선언식이다.
        // 함수 자체에는 이름이 없어서(소괄호 앞에 정의된 이름이 없음) 호출할 때는 변수이름 e를 사용한다.
        // 실행부 e("안녕 나는 e야!")를 해석해보면 e안에 들어있는 함수를 실행하면서 "안녕 나는 e야!"를 kk에게 전달하여 알림창에 보이라는 뜻이다.

        let f = (kk)=>{
            alert(kk)
        }
        f("안녕 나는 f야!")
        // function을 생략하고 화살표함수(소괄호()와 중괄호{} 사이에 화살표 =>)를 사용한 예시로, 해석하면 kk라는 값을 받아서 알림창(alert)으로 보여주는 함수를 만들고, 그 함수를 변수 f에 저장한다는 뜻이다.
        // 단, 화살표함수는 매개변수가 하나만 쓰일 때 소괄호()를 생략할 수 있다. `let f = kk=>{alert(kk)}`

        let g = (x,y)=>{
            return x+y
        }
        alert(g(1,3))
        // 화살표함수에서 소스코드가 간단하게 한 줄로 끝나는 상황이라면 return키워드를 생략할 수 있으며, 중괄호까지도 생략이 가능하다. 단, 소스코드가 한 줄로 간단해야 한다.
        // 중괄호와 return 키워드를 생략한 모습 `let g = (x,y)=>x+y`
        // 해석해보면 x와 y라는 두 값을 받아서, 그 두 값을 더한 결과를 돌려주는 함수를 하나 만들고, 그 함수를 g라는 변수에 저장한다는 뜻이다.
        // 따라서 g(1,3)을 요소로 실행시키면 x에는 1, y에는 3이 들어가 함수를 실행한 후 4라는 값이 리턴되고, 이 값이 alert창으로 화면에 보이게 된다.

        let h = (x,y)=>[x+y]
        // 해석해보면 h라는 이름의 화살표함수를 선언한다. 그리고 매개변수 x와 y를 받아서 배열 형태로 반환한다는 의미다.
        alert(h(2,4))
        // 2는 x에, 4는 y에 요소로 들어가서 최종적으로 배열데이터[6]가 리턴되고, 이것이 문자열로 변환된 상태로 알림창에서 보이게 된다.

        // 함수 선언식은 자바스크립트가 코드를 실행하기 전에 함수 전체를 미리 메모리에 등록하기 때문에 정의 이전에 호출해도 정상적으로 동작한다.
        // 즉, 자바스크립트가 코드를 실행하기 전에 함수 선언식과 변수 선언을 먼저 메모리에 올려두는 동작인 호이스팅이 적용되어 호출위치가 앞, 위쪽에 있어도 에러가 나지 않는다.
        // 그러나 함수표현식은 변수가 선언만 되어있고 함수가 아직 할당되어있지 않아서, 변수가 선언되고 할당되는 순간까지 기다려야 한다.
        // 결론 - 함수 선언식만 호이스팅이 적용되어 정의 이전에 호출할 수 있고, 함수 표현식과 화살표함수는 변수에 할당된 이후에만 사용할 수 있다.
    </script>
</body>
</html>
