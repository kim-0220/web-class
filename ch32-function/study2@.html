<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>함수의 return</title>
</head>
<body>
    <h1>함수 안에서 리턴 표현</h1>
    <p>함수에서 return이라는 키워드를 만나면 그 즉시 함수는 종료되며, return키워드 오른쪽의 값을 함수가 사용되었던 자리에 남긴다.</p>
    <script>
        function a(){
            return "좋은아침"
            document.write("<h1>안녕하세요!</h1>")
        }
        a()
        // a라는 함수를 실행시켰으나 return이라는 키워드를 만나 함수가 종료되어 이후에 나오는 document.write는 해석이 실행되지 않았고, 또한 a()의 자리에 "좋은아침"이라는 문자데이터가 남게된다.
        let b = a()
        alert(b)
        // 이에따라, b라는 변수에는 a()에서 대체되어 남은 "좋은아침"이라는 값이 저장이 되었고, 이를 확인하기위해 alert하면 화면에도 "좋은아침"이라는 알림창이 뜨게 된다.

        function c(){
            document.write("<p>c함수가 실행되었습니다.</p>")
            return 1
        }
        c()
        console.log(c())
        // c라는 함수가 실행되었기 때문에 일단 document.write가 화면에 보여지고, return함수에 의해 c()의 자리에 1이 남는다.
        // 따라서 console.log를 해도 위와 같은 프로세스로 진행이 되어 화면에 보여진 후 똑같이 1이 남고, console창에 보이게 된다.

        function d(){
            document.write("<p>d함수가 실행되었습니다.</p>")
            return 4
        }
        c()+d()
        console.log(c()+d())
        // c와 동일한 프로세스로 진행이 되며, c()자리에는 1이 남고, d()자리에는 4가 남아서 1+4의 결과값인 5가 console창에 보이게 된다.
        
        function e(n1,n2){
            return n1+n2
        }
        e(1,2)
        console.log(e(1,2))
        // return함수로 인해 함수가 실행되면 n1=1, n2=2로 해석되어 3이라는 값이 e(1,2)자리에 남게된다.
        console.log(e(e(1,2),4))
        // e(1,2)자리에 3이라는 값이 나오고 이는 n1이 되며, 4가 n2여서 결과값은 7이 출력된다.

        function f(word){
            document.write("<p>나는 "+word+"이 될거야!</p>")
            return word
        }
        console.log(f("아이언맨")?"그래그렇게해라":"안돼")
        // 위의 경우 인자가 매개변수에 들어가기때문에 word는 "아이언맨"이며, 이에따라 return으로 인해 남는 값도 "아이언맨"이다.
        // 위를 해석하면 화면에 document.write가 도출되고, return으로 인해 함수가 종료되며 "아이언맨"이 자리에 남게 된다. 이는 true값이기 때문에 최종 결과값은 "그래그렇게해라"가 나온다.

        function g(simpsons){
            document.write(`${simpsons[0]}씨의 직업은 ${simpsons[1]}이고 ${simpsons[2]}세이군요.`)
            return simpsons
        }
        g(["김민지","웹퍼블리셔",28])[1]
        // ->웹퍼블리셔 1번째 원소가 남음
        // 인자에 배열데이터가 ?????????여기부터 다시 공부 피룡,,,

        
        function h(simpsons){
            document.write(`${simpsons[0]}씨의 직업은 ${simpsons[1]}이고 ${simpsons[2]}세이군요.`)
            return {age:simpsons[2],name:simpsons[0],job:simpsons[1]}
        }
        h(["김민지","웹퍼블리셔",28])
        // 객체형태로 리턴
        // 인자를배열형태로 받아서 객체 형태로 리턴
        h(["김민지","웹퍼블리셔",28]).age
        h(["김민지","웹퍼블리셔",28]).name
        h(["김민지","웹퍼블리셔",28]).job






        function gatAver(arr){
            // 평균값을 계산해서 리턴하는 함수
            // 들어오는 데이터가 배열이라고 가정
            return((arr[0]+arr[1]+arr[2])/3).toFixed(3)
        }
        getAver(1,2,3)

    </script>
</body>
</html>
