<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>값의 형태로 정의하는 함수</title>
</head>
<body>
    <script>
        function a(){
            alert("aaa")
        }
        // a라는 함수라는 것을 만든다는 것은 자바스크립트에 a라는 이름의 ??함수 형태가 저장이 되어있는 것이다.
        // 함수를 정의한다는 것은 변수에 함수를 저장하는 행위와 동일하다.
        let b = function(){
            alert("bbb")
        }
        b()
        // b라는 변수를 만들고 그 안에 함수의 형태를 저장하여 함수를 정의할 수 있고, 이런 함수를 익명함수라 칭한다.
        // b에 이름없는 동작이 저장되어있음.

        let c = ()=>{
            alert("ccc")
        }
        c()
        // function(){} 대신 ()=>{}의 구조로 작성 가능 (화살표함수)

        function d(n1){
            alert(n1)
        }
        d("ddd")

        let e = function(n1){
            alert(n1)
        }
        e("eee")
        
        let f = (n1)=>{
            alert(n1)
        }
        f("fff")

        // 화살표함수는 매개변수가 하나만 쓰일 때만 ()를 생략할 수 있다
        // let f = n1=>{}


        let g = (a,b)=>{
            return a+b
        }
        alert((1,3))
        // 화살표함수에서 소스코드가 간단하게 한줄로 끝나는 상황이라면 return키워드를 생략할수있으며, 중괄호까지 생략이 가능하다. 단 소스코드가 한줄이여야함
        // let g = (a,b)=>a+b -> 중괄호와 return을 생략한 모습

        let h = (a,b)=>[a+b]
        alert(h(1,3))
        // 배열일경우 ?????????????????

        // 기본방식으로 함수를 정의하면 function정의하면 항상 먼저 정의되기 때문에 함수 실행부가 앞,위쪽에 위치해도 에리가 않음
        // 이를 호이스팅 방식이라한다
        // 3가지 방법 꼭 알아놔야함
        // 함수선언식은 자바스크립트가 코드를 실행하기 전에 미리 메모리에 올려놓기 대문에 정의하기전에 호출해도 작동힘.
        // 함수표현식은 변수에 저장하는 거라서, 변수가 선언되고 할당되는 순간까지 기다려야함.


    </script>
</body>
</html>
