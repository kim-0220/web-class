<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문서객체 - Document Object Model (DOM)</title>
</head>
<body>
    <h1>자바스크립트의 객체 시스템</h1>
    <p>자바스크립트는 브라우저 자체를 객체로 이해하고 있으며 최상위 객체를 window객체라고 부른다.</p>
    <p>그리고 그 최상위 객체 window아래에는 여러 객체들이 포함되어 있다.</p>
    <ul>
        <li>document -> 정보들을 표현하는 문서객체</li>
        <!-- 현재 보여지는 웹페이지의 문서 자체를 나타냄. dom에 접근할 수 있음 -->
        <li>location -> 웹페이지의 위치 정보를 표현하는 객체</li>
        <!-- 현재 웹페이지의 위치 정보를 가리킴(페이지 이동, 새로고침 등) -->
        <li>history -> 이동했던 페이지들에 대한 정보를 관리하는 객체</li>
        <!-- 방문 기록에 대한 정보를 갖고있음(뒤로가기, 다시 앞으로가기) -->
        <li>console -> 개발자 툴에 있는 콘솔 객체</li>
        <!-- 콘솔을 출력 -->
        <li>navigator -> 브라우저의 정보를 담고있는 객체</li>
        <!-- 브라우저 및 OS정보를 갖고있음 -->
    </ul>
    <script>
        console.log(window)
        // window.alert("안녕")
        // window.location.href = "https://www.naver.com"
        // window.location.reload()
        // window.history.back()
        // window.history.forward()
        // window.history.go()
    </script>
</body>
</html>
