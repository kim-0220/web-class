<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문자 데이터 - string</title>
</head>
<body>
    <h1>문자 데이터</h1>
    <p>자바스크립트에서 문자데이터를 표현하기위해서는 내용의 앞뒤로 쌍따옴표/홑따옴표/백틱을 사용한다.</p>
    <p>문자데이터끼리 더하면 이어진다.</p>
    <script>
        console.log("김"+"민"+"지")
        // 문자데이터를 더할 수 있음. 결과값은 김민지
        console.log("웹퍼블리셔"+"김민지"[2].length)
        // 김민지라는 문자의 2번째 값은 "지"이고, 이것의 갯수는 1이기 때문에 결과값은 웹퍼블리셔1로 나옴
        console.log(("웹퍼블리셔"+" 김 민지"[0]).length)
        // 김 민지의 0번째 값은 "김"이고, 웹퍼블리셔와 김을 더하면 "웹퍼블리셔김"이 되며, 이것의 갯수가 결과값이기 때문에 6이 나옴
        console.log(("김"+"민"+"지").length)
        // 문자데이터를 더한 값은 "김민지"로 나오고 이것의 갯수가 결과값이기 때문에 3이 나옴
        console.log("김민지"[1]+"김민지"[0]+"김민지"[2])
        // "김민지"라는 데이터의 n번째 결과값을 찾는 것이라 각각 "민", "김", "지"라는 값이 나오고, 이를 모두 더한 최종 결과값은 "민김지"임
    </script>
    <script>
        "김민지";'김민지';`김민지`;
        // 쌍따옴표, 홑따옴표, 백틱이 사용 가능하나 혼용은 불가
        // 명령마다 한 줄로 그냥 연결해서 사용하면 안됨. 만약 한 줄로 나열해서 사용 시 ;(세미콜론)을 찍어줘야 함
        // enter를 치면 암묵적으로 ;(세미콜론)을 찍은 것이라고 인식되기 때문에 오류가 나지 않음
        alert(`김민지`)
        // 알림창이 뜨는 함수
        alert("김민지's class")
        // 문자데이터 사이에 홑따옴표 등이 하나 적히는 것은 상관 없음
        alert('김 민 지'.length)
        // 문자데이터의 갯수를 세는 것. 단 띄어쓰기도 공백문자로 인식되어 5라는 값이 나옴
        alert("김민지"[0])
        // 문자데이터에서 0번째 값을 찾는 것. 즉 "김"이라는 값이 나옴 (숫자를 셀때는 0부터 시작)
        alert(`김민지`[0].length)
        // 김민지의 0번째 값은 "김"이고 이것의 갯수는 1이라서 1이라는 값이 나옴 

        console.log(`김민지`)
        // 개발자모드(F12) 콘솔창에서 확인 가능한 값
        console.log("김민지's class")
        console.log('김 민 지'.length)
        console.log("김민지"[0])
        console.log(`김민지`[0].length)
    </script>
</body>
</html>
