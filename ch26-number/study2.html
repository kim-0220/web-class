<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수학관련도구(함수)</title>
</head>
<body>
    <h1>수학 계산 함수</h1>
    <script>
        console.log(Math.ceil(5.33))
        // 입력된 숫자보다 크거나 같은 가장 작은 정수를 반환하는 올림(Ceiling) 함수
        // 소수점 아래에 숫자가 있으면 무조건 올림 처리하여, 양의 무한대 방향으로 가장 가까운 정수로 변환
        console.log(Math.floor(5.9))
        // 주어진 숫자와 같거나 작은 정수 중 가장 큰 값을 반환하는 내림(floor)/버림 함수
        // 소수점을 무조건 버리고 아래쪽 정수로 내림한 결과를 반환하며, 음수일 경우 더 작은 수로 내림 처리
        console.log(Math.round(5.5))
        // 무조건 소수 첫 번째 자리를 반올림하여 정수 값을 리턴하는 반올림(rounding) 함수
        // 0.5 이상은 올림, 0.5 미만은 버림 처리
        console.log(Math.pow(10,3))
        // Math.pow(base, exponent)함수는 밑(base)을 지수(exponent)만큼 거듭제곱한 값을 반환
        console.log(Math.sqrt(100))
        // 전달된 양수 값의 제곱근(루트)값을 반환
        // 음수의 제곱근은 허수로서 존재하지 않기에 루트 안에 음수값은 들어갈 수 없음. 따라서 Math.sqrt(대상숫자)에서 대상숫자가 음수일 경우 출력값은 NaN이 되며 '숫자가 아니다'라는 의미의 에러가 발생함
        console.log(Math.abs(-30))
        // 주어진 숫자 x의 절대값(absolute value)을 반환
        // 음수는 양수로 변환하고, 양수와 0은 그대로 유지하여 부호 없는 수의 크기만 남김. 매개변수가 숫자가 아니면 숫자로 강제 변환하며, 변환 불가능한 경우 NaN을 반환
        console.log(Math.max(1,2,3,4,5,6))
        // 전달받은 0개 이상의 숫자 중 가장 큰 수를 반환
        // 숫자 목록을 직접 입력하거나 스프레드 연산자(...)를 사용하여 배열의 최댓값을 찾을 수 있으며, 인수가 없으면 -Infinity를, 숫자가 아닌 값이 포함되면 NaN을 반환
        console.log(Math.min(1,2,3))
        // 전달된 숫자 중 가장 작은 값을 반환
        // 배열의 경우 스프레드 연산자(...)를 사용하며, 매개변수가 없으면 Infinity를 반환
        console.log(Math.random())
        // 0 이상 1 미만의 난수(랜덤한 숫자)를 반환하는 함수
        console.log(123.333231234.toFixed(3))
        // 숫자를 고정 소수점 표기법으로 포맷하여 반올림된 값을 문자열(String)로 반환
        // 소수점 뒤에 나타날 자릿수는 0이상 100이하의 값을 사용하며 지정할 수 있고, 필요시 반올림하고 자릿수가 모자라거나 값을 넣지 않으면 0이 기본으로 사용됨
    </script>
</body>
</html>
