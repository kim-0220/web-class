<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>숫자 데이터 - number</title>
</head>
<body>
    <h1>숫자 데이터</h1>
    <p>숫자데이터는 따로 따옴표나 백틱 없이 적으면 됨. 단, (계산이 가능한)유효한 숫자만 적어야한다 -> 010은 계산이 불가한 숫자</p>

    <h2>typeof()</h2>
    <p>괄호 안의 데이터 형태를 검사하고 그 결과를 문자데이터 형태로 알려주는 도구(함수)</p>
    <script>
        console.log(100)
        console.log(100+40)
        console.log(100+4*50)
        console.log((100+10)*2)
        console.log(10*3)
        console.log(10-200)
        console.log(100/5)
        console.log(100%3)
        // 100%3 -> 100을 3으로 나눴을 때 나머지가 1임을 표현한 것
        console.log(100+"100")
        // 100+"100" -> 숫자100과 문자100이 더해져서 100100이라는 문자데이터 값이 나옴
        console.log(100+"20"+35)
        // 100+"20"+35 -> 숫자100과 문자20, 숫자35가 더해지면 숫자 135에 20이라는 문자가 되는 것이 아니라, 모두가 문자로 인식되어 순서대로 1002035가 됨
        // 문자데이터가 하나라도 껴있으면 무조건 문자데이터로 인식되어 값이 나옴
        console.log(typeof("김민지".length))
        // typeof -> 문자인지 숫자인지 확실하지 않은 데이터를 검사할 수 있는 도구
        // 위의 함수로 확인해보면 괄호 안의 데이터가 숫자임을 알 수 있음. 따라서 결과값은 숫자를 의미하는 number라는 문자데이터 값이 나옴
        console.log(typeof(typeof("김민지".length)))
        // typeof는 결과값을 문자데이터 형태로 알려주기 때문에 다시 typeof를 씌우면 "number"라는 문자를 뜻하는 string값이 나옴
        console.log((typeof(typeof("김민지".length)))[3])
        // 위의 함수에 이어서 "string"이라는 문자데이터의 3번째 값인 i가 결과값으로 나옴
    </script>

    <h2>String()</h2>
    <p>숫자데이터를 문자데이터로 바꿔주는 함수</p>
    <script>
        100
        "100"
        console.log(String(100))
        // 말그대로 100이라는 숫자를 String이라는 함수에 넣어 문자인 100으로 바꾼 것
        console.log(typeof(String(100)))
        // string(100)의 값이 진짜 숫자인지 문자인지 확인할 수 있는 함수. 결과값은 string이라는 문자데이터 값이 나옴
        console.log(String(100)+200)
        // "100"이라는 문자데이터와 200이라는 숫자데이터를 합하면 결과값은 "100200"이라는 문자데이터가 도출됨
    </script>

    <h2>Number()</h2>
    <p>문자데이터를 숫자데이터로 바꿔주는 함수</p>
    <script>
        "455"
        455
        console.log(Number("455"))
        // 쌍따옴표 안에 있는 "455"의 문자데이터를 Number라는 함수에 넣어 숫자데이터인 455로 결과값을 도출
        console.log(Number("200")+100)
        // 쌍따옴표 안에 있는 "200"의 문자데이터를 Number라는 함수에 넣어 숫자데이터인 200 값이 나왔고, 이를 100이랑 합산해서 최종 결과값은 300이 도출됨
    </script>

    <h2>prompt()</h2>
    <p>홈페이지의 사용자에게 괄호안의 질문을 한 후 사용자가 입력한 대답을 (prompt함수가 실행되었던 자리에) 문자데이터 형태로 남겨주는 함수</p>
    <script>
        // console.log(prompt("당신의 이름은 무엇입니까?"))
        alert(prompt("당신의 이름이 무엇인가요?")+"님 환영합니다.")
    </script>
</body>
</html>
