<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>swiper</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"/>
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    <link rel="stylesheet" href="./css/study1.css">
    <script src="./js/study1.js"></script>
</head>
<body>
    <!-- Slider main container -->
    <div class="swiper station">
        <!-- Additional required wrapper -->
        <ul class="swiper-wrapper train">
            <!-- Slides -->
            <li class="swiper-slide">
                <img src="./img/녹차밭.jpg" alt="녹차밭">
            </li>
            <li class="swiper-slide">
                <img src="./img/생녹차잎.jpg" alt="생녹차잎">
            </li>
            <li class="swiper-slide">
                <img src="./img/우려진 녹차.jpg" alt="우려진 녹차">
            </li>
        </ul>
        
        <!-- If we need pagination -->
        <div class="swiper-pagination"></div>

        <!-- If we need navigation buttons -->
        <div class="swiper-button-prev"></div>
        <div class="swiper-button-next"></div>

        <!-- If we need scrollbar -->
        <div class="swiper-scrollbar"></div>
    </div>

    <div class="swiper station2">
        <ul class="swiper-wrapper train2">
            <li class="swiper-slide">
                <img src="./img/여러 종류의 차.jpg" alt="여러 종류의 차">
            </li>
            <li class="swiper-slide">
                <img src="./img/말린잎.jpg" alt="말린잎">
            </li>
            <li class="swiper-slide">
                <img src="./img/오미자.jpg" alt="오미자">
            </li>
        </ul>
        <div class="swiper-button-next"></div>
        <div class="swiper-button-prev"></div>
        <div class="swiper-pagination"></div>
    </div>
</body>
</html>
