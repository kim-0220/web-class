<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>date객체 활용하기</title>
</head>
<body>
    <h1>date객체</h1>
    <p>date객체를 통하여 날짜 정보를 가져올 수 있다.</p>
    <p id="clock">현재 2026년 3월 9일 9시 37분 10초입니다.</p>
    <script>
        const colck = document.querySelector("#clock")

        setInterval(function(){
            
        },1000)
        
        let today = new Date()
        // new가 있기 때문에 암묵적으로 Date가 생성자함수? 객체 만드는 함수 객체가 만들어짐? 객체는 getFullYear, getHours 등의 메서드가 이미 만들어져 있고
        let year = today.getFullYear()
        let month = today.getMonth()
        let monthArray = ["1월","2월","3월","4월","5월","6월","7월","8월","9월","10월","11월","12월"]
        let date = today.getDate()
        let hour = today.getHours()
        let minute = today.getMinutes()
        let second = today.getSeconds()

        colck.innerHTML = `현재${year}년 ${monthArray[month]}월 ${date}일 ${hour}시 ${minute}분 ${second}초입니다.`

        console.log(year)
        console.log(month)
        // 2라는 값이 도출됨. 그 이유는 1월이 0, 2월이 1, 3월이 2 ... 12월은 11로 배열의 원소처럼 0부터 카운팅이 되기 때문이다.
        console.log(monthArray[month])
        // 따라서 배열데이터 형태로 써야 3월이 나옴!
        console.log(date)
        console.log(hour)
        console.log(minute)
        console.log(second)

    </script>
</body>
</html>
