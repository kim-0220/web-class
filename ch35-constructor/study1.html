<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>생성자 함수</title>
</head>
<body>
    <h1>생성자 함수</h1>
    <p>객체를 생성하는 함수 (객체를 찍어내는 공장같은 함수)</p>
    <p>같은 구조의 객체를 많이 만들 때 편하게 만들려고 사용</p>
    <ul>특징
        <li>첫글자 대문자: function Person()</li>
        <li>new로 호출: new Person()</li>
        <li>this사용: this.name</li>
    </ul>
    <script>
        function Person(uname,uage){
            this.name = uname
            this.age = uage
            this.sayHello = function(){
                alert(`안녕하세요 저는 ${this.name}입니다.`)
            }
        }
        // 객체를 만드는 틀

        let person1 = new Person("김민지",28)
        // 객체를 만드는 방법 - 생성

        // let person1 = {
        //     name: "김민지",
        //     age: 28,
        //     sayHello: function(){
        //         alert(`안녕하세요 저는 김민지입니다.`)
        //     }
        // }
        // 위와 동일한 내용을 풀어서 쓴 것으로, 생성자 함수로 했을 때 구조를 계속 복붙하지 않고 짧게 한 줄로 사용 가능

        person1.sayHello()
        // person1의 sayHello를 실행()하면 "안녕하세요 저는 김민지입니다."라는 알림창이 뜸
        // 필요한 것만 실행시키면 됨 - 기능 실행
    </script>
</body>
</html>
