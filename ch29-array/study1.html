<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배열(array) - 조합데이터</title>
</head>
<body>
    <script>
        // [] -> 배열데이터 표현법
        // ,,, -> 내부에 ,(콤마)를 사용하여 여러 데이터를 구분. 콤마로 구분되는 데이터들을 '원소'라고 함
        // 원소들은 자유롭게 string, number, boolean, array데이터 모두 들어올 수 있음!
        ["사과","배","귤","수박"]
        // 왼쪽에 있는 원소가 가장 먼저 저장된 원소이고, 순번을 정해서 [0번째 원소, 1번째 원소, 2번째 원소, 3번째 원소]라고 칭함
        let a = ["사과","배","귤","수박"]
        // a라는 변수에 배열을 저장했다는 의미. a에는 배열데이터가 저장되어있고, 그 안에 원소 4개가 저장이 되어있다고 해석하면 됨
        console.log(a[0])
        // a라는 데이터의 0번째 원소를 선택을 한다는 의미
        // []는 순번대괄호, 즉 indexbox라고 함
        console.log(a[4])
        // 4번재 원소는 존재하지않기 때문에 정해지지 않았다는 의미로 undefined가 도출됨
        console.log(a.length)
        // 원소 4개가 저장되어있는 배열데이터이기 때문에 결과값은 4로 나옴
        console.log(a[0][1])
        // a[0]은 a데이터의 0번째 원소를 선택한다는 의미로 "사과"라는 값이 나오고, 이 값의 1번째 원소("사과"[1])는 "과"이므로 결과값이 '과'로 나옴

        let b = [1,2,3,4][3]
        // b라는 변수에 1,2,3,4라는 배열데이터가 저장되어있고, 이것의 3번째 원소를 b에 저장하겠다는 의미
        console.log(b)
        // 3번째 원소인 '4'가 결과값으로 도출됨

        let c = [
            1,
            2,
            3,
            4
        ]
        // 위처럼 콤마 뒤로 enter를 쳐서 표현할 수도 있음
        console.log(a[c[3]])
        // c[3]은 4라는 값이 도출되고, 그럼 a[4]는 undefined가 도출됨
        console.log(a[c[3]?1:2].length)
        // c[3]은 4라는 값이 도출되고, 4?1:2의 결과값은 4라는 숫자데이터는 true값이기 때문에 1이라는 값이 최종적으로 나옴
        // 따라서 a[1]은 "배"라는 값이 나오고, 이것에 .length를 구하면 결과값 1이 나옴

        let d =["장윤서","이은지","김선영","김가희","최예슬"]
        console.log(d[2][1]+d[3][2])
        // d[2]는 "김선영"이 나오고, 이것의 1번째 원소인 "선"이 결과값으로 도출됨.
        // d[3]은 "김가희"가 나오고, 이것의 2번째 원소인 "희"가 결과값으로 도출됨.
        // 따라서, "선"문자데이터와 "희"문자데이터를 잇는 값(+)인 "선희"가 결과값으로 도출됨. 
        console.log((!d[3]||!d[4]||d[1])[0])
        // d[3]은 "김가희"라는 문자데이터가 나오고 이는 true값인데 이에 !(느낌표) 부정을 하면 false값이 나옴
        // d[4]는 "최예슬"이라는 문자데이터가 나오고 이는 true값인데 이에 !(느낌표) 부정을 하면 false값이 나옴
        // ||(또는)의 성질때문에 하나라도 true값이 있으면 true값이 나오고, d[1]은 "이은지"라는 문자데이터가 나오고 이는 true값이기에 "이은지"[0]은 "이"라는 결과값을 도출함
        // 따라서 최종적으로 console창에 나오는 값은 "이"이다.

        let e = 0||0||0
        console.log(e)
        // ||(또는)은 흐름을 알려줄 뿐, 전체 값이 false일 경우 마지막 값인 0이 결과값으로 도출됨

        let person1 = ["김민지","여자","isfp",169,53,false,["독서","복싱","청소","영화관람","산책"]]
        console.log(person1[5]?"기혼":"미혼")
        // 5번째 원소값이 false이여서 결과값은 "미혼"으로 도출됨
        console.log(person1[6][2][1])
        // 6번째 원소값인 ["독서","복싱","청소","영화관람","산책"]에서 2번째 원소값인 "청소"중 1번째 원소갑인 "소"가 결과값으로 도출됨

        
        // 문자데이터에서 했던 것처럼(아래처럼) 배열데이터도 유사하게 표현 가능
        console.log("김민지"[0])
        // javascript에서 문자데이터를 문자열이라고 말함 
        console.log("김민지".length)
        // 문자열의 길이 -> 글자의 개수를 의미
    </script>
</body>
</html>
