<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>변수(variable)</title>
</head>
<body>
    <h1>변수</h1>
    <p>변할 가능성이 있는 수</p>
    <script>
        let a;
        // 새롭게 변수공간을 만든다는 의미 -> a라는 변수공간을 생성
        // 공식적으로 "a라는 변수를 선언한다."라고 표현함
        a = 10
        // a라는 변수에 10이 저장된다는 의미 ( = 등호는 저장한다는 의미를 갖고있음)
        // a라는 비어있는 변수에 처음으로 10이라는 수를 저장하는 것을 공식적으로 "a라는 변수를 10으로 초기화한다."라고 함 (초기화 -> 최초로 데이터화(저장)하는 행위)
        console.log(a + 10)
        // a라는 변수에 10이 저장되어있는 상태(즉, 10)에 10을 더한 값이기 때문에 결과값은 20으로 나옴
        console.log(a)
        // a에 저장되어있는 값을 확인하고 싶을 때 사용
        a = a + 10
        // a 메모리에 이미 저장되어있던 a의 값 10에 10이라는 수를 더하여 총 20이라는 수를 a 변수에 저장하겠다는 의미
        // 이전의 a값(10)은 지워지고 새로운 변수 a값(20)이 저장됨
        console.log(a)
        a+=10
        // a에 10을 더한 값을 a에 저장한다는 의미 -> **중요!**암기!
        console.log(a)

        let b = 20
        // b라는 변수를 생성함과 동시에 초기화까지 한 것 (보통 이런식으로 표현)
        b-=2
        // b에서 2를 뺀 값을 b에 저장한다는 의미 -> **중요!**암기!
        console.log(b)

        let c = "안녕하세요"
        console.log(c[2])
        // c라는 변수에 저장되어있는 문자 중 2번째 데이터를 도출
        console.log(c[2]+c[4])
        // 2번째와 4번째 문자데이터를 더한 값 -> 문자가 이어지는 값으로 나오기 때문에 '하요'라는 값이 도출
        console.log((c[2]+c[4]).length)
        // '하요'라는 문자데이터의 개수는 2로 도출됨
        console.log(Math.max((c[2]+c[4]).length,c.length))
        // 각각 2와 5라는 값이 도출되고, 이중 가장 큰 수가 도출되는 함수를 사용하였기에 값은 5로 나옴

        prompt("당신의 이름은 무엇인가요?")
        // 프롬포트 알림창에 작성된 내용이 prompt()에 저장됨
        document.write("<h3>김민지님 안녕하세요!<h3>")
        // html에서는 화면 영역을 document라고 부르는데 이 화면에 출력하는 함수임
        // 이 함수를 이용해 html의 태그를 출력하면 html을 직접 작성한 것과 같은 효과. 단순 문자열을 브라우저에 출력하는 것도 가능
        // 다른 태그들과 동일하게 개발자모드에서 태그가 생성된 것을 확인할 수 있음
        // html에서 사용되는 태그형식(꺽새)만 사용하면 작동이 안되고, ""(쌍따옴표)로 묶어 문자데이터로 만들어야 됨
        document.write("<h3>"+prompt("당신의 이름은 무엇인가요?")+"님 안녕하세요!<h3>")
        // 화면에 출력되는 내용은 '알림창이 떴을 때 적은 이름+님 안녕하세요'가 h3태그의 스타일이 적용된 상태로 보이게 됨
        // java함수를 태그와 더할 때 "+java함수+"의 형태로 적어야 함. -> 쌍따옴표("")와 더하기(++)사이에 함수 기재 
        
        let name = prompt("당신의 이름이 무엇인가요?")
        // name이라는 변수를 선언함과 동시에 prompt("당신의 이름이 무엇인가요?")로 초기화(저장)까지 한 것
        document.write("<h3>"+name+"님 안녕하세요!<h3>")
        // 화면에 h3태그 속성을 지닌 (사용자가 직접 질문에 대한 답변을 작성한)name이라고 선언되어있는 값에 '님 안녕하세요!' 합친 값을 화면에 출력됨
        prompt(name+"님 나이는 몇살인가요?")
        // 프롬포트 알림창이 나오며, 사용자가 작성한 내용이 저장되어있는 name값과 '님 나이는 몇살인가요?'의 문구가 합쳐진 값이 출력됨
        let age = prompt(name+"님 나이는 몇살인가요?")
        // age라는 변수를 선언함과 동시에 이미 선언되어있는 사용자가 작성한 name값과 '님 나이는 몇살인가요?'를 합친 값을 알림창으로 띄운다는 의미
        document.write("<p>"+name+"님의 나이는 "+age+"살이군요. 반갑습니다.</p>")
        // p태그 형식을 적용하면서, 사용자가 작성해주는 name값과 age값을 합친 내용을 화면에 보여주겠다는 의미
    </script>

    <h1>상수</h1>
    <p>변하지 않는 수</p>
        <script>
        323
        "김민지"
    </script>
</body>
</html>
