<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>변수의 종류</title>
</head>
<body>
    <script>
        let a = 100;
        // 똑같은 변수명을 허용하지 않음. 따라서 오류 발생이 적으며, 만약 오류가 발생하더라도 console창에서 확인이 가능함
        a = 200;
        // 수정 시 초기에 선언한 let은 제외하고 적어야 함
        
        var b = 200;
        // let과 동일하게 b라는 이름으로 변수공간이 생성되며 그 안에 200이 저장되는 것임
        var b = 300;
        // 단 let과는 다르게 덮어쓰기가 가능(똑같은 변수명 허용)하여 앞서 저장된 내용은 삭제되고, b라는 변수공간에 300이 저장됨.
        // 대신 이런 덮어쓰기 방식은 팀 프로젝트에서 문제 발생 및 오류를 높임

        const OWNER = "김민지";
        // 초기 설정값이 바뀌면 안될 때 사용하는 변수. 따라서 수정시 초기값 자체를 바꾸어야함
    </script>
</body>
</html>
